      <main>
        <h1>CloudBee Robotics: anyone describes a task, any robot learns it</h1>
        <p>
          Describe the task. We help build the skill for your robot, in your own work cell. No R&amp;D team needed on
          your side. CloudBee Robotics is an RWTH Aachen spin-off in Aachen, Germany, funded by an EXIST grant and a
          WestAI compute grant.
        </p>
        <h2>How it works</h2>
        <ol>
          <li>Describe: write the task in plain words, optionally with a phone video of your cell.</li>
          <li>Generate: training data with touch and force is generated on GPUs in a digital twin of your cell.</li>
          <li>Adapt: an open robot foundation model is adapted to your cell and your task.</li>
          <li>Improve: the skill runs, spots what failed, and is retrained and redeployed.</li>
        </ol>
        <h2>Robots and sectors</h2>
        <p>Robot arms, humanoids and dexterous hands. Industrial manufacturing, automotive, electronics, battery technology and logistics.</p>
        <h2>Pilots</h2>
        <p>2 pilots running, 2 pilots in negotiation and 1 letter of intent, with 5 industrial companies engaged in 5 months.</p>
